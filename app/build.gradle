plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// =====================================================================
// VÈSYON OTOMATIK — pa bezwen chanje anyen alamen ankò.
//   versionCode = kantite minit depi 1 jan 2024 → li monte pou kont li
//                 nan CHAK build (toujou pi gwo pase build anvan an).
//   versionName = APP_VERSION_BASE + dat build la, egz. "1.2.261109"
// Chanje APP_VERSION_BASE (1.2 → 2.0) sèlman lè w vle yon gwo nimewo.
// version.json sou sit la li chif sa yo DIRÈKTEMAN nan APK a.
// =====================================================================
def APP_VERSION_BASE = '1.2'
def buildDate = new Date()
def epoch2024 = new java.text.SimpleDateFormat('yyyy-MM-dd').parse('2024-01-01')
def autoVersionCode = ((buildDate.time - epoch2024.time).intdiv(60000L)) as int
def autoVersionName = APP_VERSION_BASE + '.' + new java.text.SimpleDateFormat('yyMMdd').format(buildDate)

android {
    namespace 'com.plusgroup.pos'
    compileSdk 34

    defaultConfig {
        applicationId "com.plusgroup.pos"
        // minSdk 21 = Android 5.0 — kouvri prèske tout aparèy SUNMI ki an sèvis,
        // menm ansyen modèl V1/V2 yo.
        minSdk 21
        targetSdk 34
        versionCode autoVersionCode   // otomatik (gade anlè fichye a)
        versionName autoVersionName

        // IMPÒTAN: mete TOULEDE achitekti yo pou APK a enstale sou nenpòt aparèy
        // (32-bit AK 64-bit). Se yon kòz komen POS pa ka enstale APK yo.
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        aidl true
    }

    // Pa "split" APK pa achitekti — nou vle YON SÈL APK ki mache sou tout aparèy,
    // pi fasil pou distribye bay ajan yo (WhatsApp, elatriye).
    splits {
        abi {
            enable false
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'

    // Rezo — koneksyon ak backend NestJS la
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Coroutines pou apèl rezo asenkwòn
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Pull-to-refresh pou "Mes fiches"
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Eskane QR / kòd-ba fich yo ak kamera a (mache san Google Play Services,
    // kidonk sou POS SUNMI yo tou). core 3.3.0 = konpatib minSdk 21.
    implementation('com.journeyapps:zxing-android-embedded:4.3.0') { transitive = false }
    implementation 'com.google.zxing:core:3.3.0'
}